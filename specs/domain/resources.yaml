# Domain Resources - AI Agent Team Platform
# Based on 04-database-design.md

resources:
  users:
    fields:
      id: { type: uuid }
      email: { type: string }
      password_hash: { type: string }
      name: { type: string }
      plan: { type: enum, values: [free, pro, enterprise] }
      api_usage_count: { type: integer }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }
    endpoints:
      - method: POST
        path: /api/v1/auth/login
      - method: POST
        path: /api/v1/auth/signup
      - method: GET
        path: /api/v1/users/me
      - method: PUT
        path: /api/v1/users/me

  teams:
    fields:
      id: { type: uuid }
      user_id: { type: uuid, ref: users }
      name: { type: string }
      description: { type: text }
      template_id: { type: uuid, ref: team_templates, nullable: true }
      config: { type: jsonb }
      status: { type: enum, values: [active, paused, archived] }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }
      agent_count: { type: integer, computed: true }
      recent_task_count: { type: integer, computed: true }
    endpoints:
      - method: GET
        path: /api/v1/teams
      - method: GET
        path: /api/v1/teams/{id}
      - method: POST
        path: /api/v1/teams
      - method: PUT
        path: /api/v1/teams/{id}
      - method: DELETE
        path: /api/v1/teams/{id}

  agents:
    fields:
      id: { type: uuid }
      team_id: { type: uuid, ref: teams }
      name: { type: string }
      role: { type: string }
      layer: { type: enum, values: [orchestration, research, execution, quality] }
      model: { type: enum, values: [opus, sonnet, haiku] }
      prompt_template: { type: text }
      tools: { type: jsonb }
      sort_order: { type: integer }
      status: { type: enum, values: [idle, running, completed, error], computed: true }
      created_at: { type: timestamp }
      updated_at: { type: timestamp }
    endpoints:
      - method: GET
        path: /api/v1/teams/{team_id}/agents
      - method: POST
        path: /api/v1/teams/{team_id}/agents
      - method: PUT
        path: /api/v1/agents/{id}
      - method: DELETE
        path: /api/v1/agents/{id}

  tasks:
    fields:
      id: { type: uuid }
      team_id: { type: uuid, ref: teams }
      user_id: { type: uuid, ref: users }
      type: { type: string }
      input: { type: jsonb }
      options: { type: jsonb }
      status: { type: enum, values: [pending, running, completed, failed, cancelled] }
      progress: { type: integer }
      started_at: { type: timestamp }
      completed_at: { type: timestamp }
      created_at: { type: timestamp }
      team_name: { type: string, computed: true }
      duration: { type: string, computed: true }
    endpoints:
      - method: GET
        path: /api/v1/tasks
      - method: GET
        path: /api/v1/tasks/{id}
      - method: POST
        path: /api/v1/teams/{team_id}/tasks
      - method: PUT
        path: /api/v1/tasks/{id}/cancel

  task_results:
    fields:
      id: { type: uuid }
      task_id: { type: uuid, ref: tasks }
      agent_id: { type: uuid, ref: agents }
      result_type: { type: string }
      content: { type: text }
      file_url: { type: string }
      metadata: { type: jsonb }
      quality_score: { type: float }
      version: { type: integer }
      created_at: { type: timestamp }
    endpoints:
      - method: GET
        path: /api/v1/tasks/{task_id}/results
      - method: GET
        path: /api/v1/tasks/{task_id}/results/{id}/download

  task_logs:
    fields:
      id: { type: uuid }
      task_id: { type: uuid, ref: tasks }
      agent_id: { type: uuid, ref: agents }
      status: { type: enum, values: [started, processing, completed, error] }
      message: { type: text }
      progress: { type: integer }
      created_at: { type: timestamp }
    endpoints:
      - method: GET
        path: /api/v1/tasks/{task_id}/logs
      - method: WS
        path: /ws/tasks/{task_id}

  team_templates:
    fields:
      id: { type: uuid }
      name: { type: string }
      description: { type: text }
      category: { type: string }
      icon: { type: string }
      default_agents: { type: jsonb }
      is_active: { type: boolean }
      created_at: { type: timestamp }
    endpoints:
      - method: GET
        path: /api/v1/templates

  dashboard_stats:
    fields:
      running_tasks: { type: integer, computed: true }
      completed_tasks_today: { type: integer, computed: true }
      total_teams: { type: integer, computed: true }
    endpoints:
      - method: GET
        path: /api/v1/dashboard/stats
